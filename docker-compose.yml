name: admin-web

services:
  admin-web:
    image: ${WEB_IMAGE:-nuxtui-web:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admin-web
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "${WEB_PUBLIC_HOST:?set WEB_PUBLIC_HOST in .env}:host-gateway"
    # nginx on this host only.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
